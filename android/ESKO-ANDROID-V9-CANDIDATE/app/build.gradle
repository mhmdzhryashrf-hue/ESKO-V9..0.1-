plugins {
    id 'com.android.application'
}

def eskoSiteUrl = (project.findProperty('ESKO_SITE_URL') ?: '').toString()
        .replace('\\', '\\\\')
        .replace('"', '\\"')

android {
    namespace 'com.esko.openhub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.esko.openhub'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '9.0.2'
        buildConfigField 'String', 'ESKO_SITE_URL', '"' + eskoSiteUrl + '"'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
