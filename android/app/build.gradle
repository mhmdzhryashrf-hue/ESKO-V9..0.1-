plugins {
    id 'com.android.application'
}

def eskoSiteUrl = (project.findProperty('ESKO_SITE_URL') ?: '').toString()
    .replace('\\', '\\\\')
    .replace('"', '\\"')

android {
    namespace 'com.esko.openhub'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.esko.openhub'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '5.0'
        buildConfigField 'String', 'ESKO_SITE_URL', '"' + eskoSiteUrl + '"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
